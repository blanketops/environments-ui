# =============================================================================
# ko.yml — Ko Image Build → GHCR
#
# Builds the UI (vite → dist/), copies it to server/kodata so ko bundles it
# into the API server's image, and pushes one image that
# serves both from the same origin: /api and /health from the Go handlers,
# everything else from the bundled UI with an index.html fallback for
# client-side routes. Separate from release.yml (changelog + GitHub
# Release) — same split as environments-controller's and
# environments-docs' ko.yml/release.yml, both firing on the same tag.
#
# No Dockerfile — this org builds and publishes images via ko, which also
# needs no Docker daemon (the self-hosted runners are pods without one).
#
# Registry: ghcr.io/blanketops/environments-ui
#
# Image tagging:
#   tag push  → {version} + latest
#   manual    → {ref_name} only
#
# Signing:
#   Not signed. environments-controller signs keyless with cosign, which
#   writes the signing identity (repository and workflow) to the public
#   Rekor log; this repository is private. Add the controller's cosign
#   step if the repository goes public.
#
# Auth:
#   GHCR login uses GITHUB_TOKEN — scoped to this repository, which is
#   exactly what a same-repo package push needs.
# =============================================================================

name: Ko Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  NODE_VERSION: "24"
  IMAGE_REPO: ghcr.io/blanketops/environments-ui

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # npm's download cache lives on the runners' persistent cache volume
          # (npm_config_cache, set by the runner pool). setup-node's own cache
          # would upload that shared directory to the Actions cache after every
          # job, so it stays off.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build UI
        run: npm run build

      # ko bundles server/kodata into the image and exposes it through
      # KO_DATA_PATH at runtime. A copy, not a symlink: ko 0.18 does not
      # follow a kodata symlink to ../dist and ships an empty /var/run/ko.
      - name: Stage UI as kodata
        run: |
          rm -rf server/kodata
          cp -r dist server/kodata
          test -f server/kodata/index.html

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: false

      # ko is baked into the runner image (zenith-runner-toolchain 1.0.11+);
      # setup-ko downloaded it on every job over a slow link.
      - name: Check ko
        run: ko version

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ko login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      # tag push → {version} + latest; manual dispatch → ref_name only
      - name: Compute image tags
        id: tags
        run: |
          TAGS="${{ github.ref_name }}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAGS="${TAGS},latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      # Run from server/: it is its own Go module and holds .ko.yaml.
      - name: Build and push image
        id: ko-build
        working-directory: server
        env:
          KO_DOCKER_REPO: ${{ env.IMAGE_REPO }}
        run: |
          ko build . --bare \
            --platform linux/amd64,linux/arm64 \
            --tags "${{ steps.tags.outputs.tags }}" \
            --image-refs "${RUNNER_TEMP}/ko-image-refs"
          echo "digest=$(tail -1 "${RUNNER_TEMP}/ko-image-refs" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 🐹 Ko Image Build

          **Image:** \`${{ env.IMAGE_REPO }}\`
          **Tags:** \`${{ steps.tags.outputs.tags }}\`
          **Digest:** \`${{ steps.ko-build.outputs.digest || 'not built' }}\`

          ## Pull
          \`docker pull ${{ env.IMAGE_REPO }}@${{ steps.ko-build.outputs.digest }}\`

          ## Run
          Serves the UI and the API on port 8082; the server reads its
          kubeconfig the usual way (in-cluster service account, or KUBECONFIG).
          EOF
