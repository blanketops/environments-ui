# =============================================================================
# dependabot.yml
#
# Three ecosystems, all targeting main (dependency updates land on main
# directly; develop takes them in the next sync from main):
#   npm            — the React UI at the repository root.
#   gomod          — the API server in server/ (its own Go module).
#   github-actions — keeps action versions pinned to real, resolvable tags.
# =============================================================================

version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    # Tailwind 4 drops the PostCSS plugin and changes utility defaults
    # (border colour, ring width, shadow/radius scale); moving to it is its
    # own change with a check of the skins in a browser, not a grouped bump.
    # Minor and patch updates of 3.x still come through.
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10

  - package-ecosystem: "gomod"
    directory: "/server"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      go-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 10
