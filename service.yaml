apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: environments-ui
  namespace: blanketops-environments
spec:
  template:
    spec:
      containers:
      - image: ghcr.io/blanketops/environments-ui:latest
        env:
        - name: PORT
          value: "80"
        ports:
        - containerPort: 80
          name: http1
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
